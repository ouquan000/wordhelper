<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡背结构编辑器 · 1.4.2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="3"></rect>
          <path d="M6.5 9.5h7M6.5 13.5h10"></path>
        </svg>
      </span>
      <div class="brand-text">
        <h1>卡背结构编辑器</h1>
        <p>六级记忆卡 · schema v1 · 1.4.2</p>
      </div>
    </div>

    <div class="titlebar-fields">
      <label class="field field-book">
        <span>词书名</span>
        <input id="book-input" type="text" maxlength="40" autocomplete="off" spellcheck="false">
      </label>
      <label class="field field-spacing">
        <span>块间距 dp</span>
        <input id="spacing-input" type="number" min="4" max="32" step="1">
      </label>
    </div>

    <div class="server-state" id="server-state" title="本地服务连接状态">
      <span class="dot connecting" id="server-dot"></span>
      <span id="server-state-text">连接中…</span>
    </div>
  </header>

  <aside class="panel library-panel" aria-label="组件库">
    <header class="panel-head">
      <div>
        <h2>组件库</h2>
        <p>点一下加到末尾</p>
      </div>
      <span class="panel-tag" id="library-tag">11 种</span>
    </header>
    <div class="library-list" id="library-list"></div>
    <div class="library-foot">
      <button id="reset-layout" class="btn btn-quiet btn-block" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"></path>
          <path d="M3.5 4.5v5h5"></path>
        </svg>
        重置为默认结构
      </button>
      <p class="hint">同一类型可以加多次，靠 id 区分。手机不认识的类型会跳过，不报错。</p>
    </div>
  </aside>

  <main class="panel canvas-panel" aria-label="卡背结构">
    <header class="panel-head canvas-head">
      <div>
        <h2>卡背结构 <span class="count-chip" id="block-count">0 块</span></h2>
        <p>从上到下＝手机上从上到下，拖动可改顺序</p>
      </div>
      <div class="head-tools">
        <a class="btn btn-outline btn-sm" href="/rewrite" target="_blank" rel="noopener">重写记录</a>
        <button id="show-all" class="btn btn-quiet btn-sm" type="button">全部显示</button>
      </div>
    </header>
    <div class="block-list" id="block-list"></div>
  </main>

  <section class="panel preview-panel" aria-label="实时预览">
    <header class="panel-head preview-head">
      <div>
        <h2>实时预览</h2>
        <p>浅色 · 与手机同结构</p>
      </div>
      <label class="field field-sample">
        <span>示例词</span>
        <select id="sample-select" class="select"></select>
      </label>
    </header>

    <div class="preview-stage" id="preview-stage">
      <div class="phone">
        <div class="phone-screen">
          <article class="cb-card" id="cb-card" aria-label="卡背预览">
            <div class="cb-body" id="cb-body"></div>
          </article>
        </div>
      </div>
    </div>

    <footer class="preview-foot">
      <p id="preview-note"></p>
      <p class="preview-foot-dim">预览只保证结构与顺序；字号、颜色以手机渲染为准。</p>
    </footer>
  </section>

  <footer class="actionbar">
    <div class="actions">
      <button id="save-draft" class="btn btn-secondary" type="button">保存草稿</button>
      <button id="publish" class="btn btn-primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"></path>
        </svg>
        发布到手机
      </button>
      <button id="open-history" class="btn btn-outline" type="button">回退到上一版</button>
      <button id="copy-json" class="btn btn-quiet btn-sm" type="button" title="复制当前配置的 JSON（就是发布时发给服务端的内容）">复制 JSON</button>
    </div>

    <div class="actionbar-meta">
      <span class="meta-item" id="draft-state">尚未修改</span>
      <span class="meta-sep" aria-hidden="true"></span>
      <span class="meta-item">revision <b class="rev-badge" id="revision-badge">–</b></span>
      <span class="meta-sep" aria-hidden="true"></span>
      <span class="meta-item meta-address">
        <span class="meta-label">手机填这个地址：</span>
        <code id="lan-url" title="局域网地址">未获取</code>
        <button id="copy-url" class="icon-btn" type="button" title="复制地址" aria-label="复制地址">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
            <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A3.5 3.5 0 0 0 3 6.5v6A2.5 2.5 0 0 0 5.5 15"></path>
          </svg>
        </button>
      </span>
    </div>
  </footer>

</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<dialog id="history-dialog" class="modal" aria-labelledby="history-title">
  <header class="modal-head">
    <div>
      <h2 id="history-title">历史版本</h2>
      <p>选一版恢复为当前，手机下次刷新即生效。</p>
    </div>
    <button class="icon-btn modal-close" type="button" data-close aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18"></path>
      </svg>
    </button>
  </header>
  <div class="modal-body">
    <div class="history-list" id="history-list"></div>
  </div>
  <footer class="modal-foot">
    <p class="modal-hint">回退会用线上版本替换编辑器里的内容，未发布的改动会丢失。</p>
    <div class="modal-foot-actions">
      <button id="history-reload" class="btn btn-quiet" type="button">重新读取</button>
      <button class="btn btn-secondary" type="button" data-close>关闭</button>
    </div>
  </footer>
</dialog>

<script src="samples.js"></script>
<script src="app.js"></script>
</body>
</html>
