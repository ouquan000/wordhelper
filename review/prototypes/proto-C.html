<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · 夜读 Mono Night — 不爱背单词原型</title>
<style>
:root{
  --bg:#0A0A0B; --s1:#141416; --s2:#1F1F23; --edge:#2A2A30; --fg:#F5F5F7; --fg2:#8A8A93;
  --acc:#C6FF3D; --warn:#FFD60A; --bad:#FF453A;
  --em:cubic-bezier(.2,0,0,1); --out:cubic-bezier(.3,0,.8,.15);
  --sans:"Inter","SF Pro Display","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;display:grid;place-items:center;overflow:hidden;font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;border-radius:44px;box-shadow:0 0 0 1px #222,0 0 0 10px #050505;display:flex;flex-direction:column}
body.bare .phone{border-radius:0;box-shadow:none}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 14px var(--mono)}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:9;font:500 10px var(--mono);letter-spacing:.08em;color:var(--bg);background:var(--acc);padding:4px 6px;border-radius:4px}
main{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden}
.page.on{visibility:visible}
.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
/* learn */
.top{padding:14px 20px 0}
.top .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ctr{font:600 13px var(--mono);font-variant-numeric:tabular-nums;display:flex;overflow:hidden;height:16px}
.ctr .roll{display:inline-block}
.segs{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.segs i{height:4px;border-radius:1px;background:var(--s2);transition:background .08s}
.segs i.on{background:var(--acc)}
.deck{flex:1;min-height:0;padding:16px 16px 12px;display:flex}
.card{flex:1;background:var(--s1);border:1px solid var(--s2);border-radius:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-height:0}
.stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bad);transform:scaleY(0);transform-origin:top}
.head{padding:28px 22px 0;flex:none;transition:padding .18s var(--em)}
.card:not(.flipped) .head{flex:1;display:flex;flex-direction:column;justify-content:center}
.w{font:700 64px/.95 var(--sans);letter-spacing:-2px;transition:color .14s var(--em);word-break:break-word}
.card.flipped .w{font-size:44px;letter-spacing:-1.4px}
.pho{font:400 15px var(--mono);color:var(--fg2);margin-top:14px}
.scan{height:1px;background:var(--acc);margin:18px 22px 0;transform:scaleX(0);transform-origin:left}
.back{flex:1;overflow:auto;padding:16px 22px 22px;clip-path:inset(0 0 100% 0)}
.card:not(.flipped) .back{display:none}
.mean{font:500 22px/1.4 var(--sans);margin-bottom:18px}
.blk{border-top:1px solid var(--s2);padding:14px 0}
.blk .lbl{margin-bottom:8px}
.blk p{font-size:15px;line-height:1.6;color:#C8C8CF;margin-bottom:6px}
.blk .kv{display:flex;gap:10px;font-size:14px;line-height:1.5;margin-bottom:6px}
.blk .kv code{font:500 13px var(--mono);color:var(--fg);white-space:nowrap}
.blk .kv span{color:var(--fg2)}
.hintc{position:absolute;left:22px;bottom:20px;display:flex;gap:8px;align-items:center}
.k{font:500 11px var(--mono);border:1px solid var(--edge);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--fg2)}
.card.flipped .hintc{display:none}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px;height:78px;flex:none}
.keys button{background:var(--s1);border:1px solid var(--s2);border-radius:10px;color:var(--fg);font:600 15px var(--sans);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px 12px;cursor:pointer;position:relative;overflow:hidden;transition:background .06s linear}
.keys button:active{background:var(--edge)}
.keys button .n{font:500 11px var(--mono);color:var(--fg2)}
.keys button .fill{position:absolute;inset:0;transform:scaleX(0);transform-origin:left;z-index:0}
.keys button>*:not(.fill){position:relative;z-index:1}
.keys .again .fill{background:var(--bad)}.keys .hard .fill{background:var(--warn)}.keys .good .fill{background:var(--acc)}
.keys .flipk{grid-column:1/-1;align-items:center;flex-direction:row;justify-content:center;gap:10px;color:var(--fg2)}
.keys[data-mode="front"] .r3,.keys[data-mode="back"] .flipk{display:none}
/* books */
.ph{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:flex-end}
.ph h1{font:700 30px/1 var(--sans);letter-spacing:-.8px}
.tbl{padding:0 16px;overflow:auto}
.tbl .r{display:grid;grid-template-columns:1fr auto;gap:6px;padding:14px 14px;border:1px solid var(--s2);border-radius:12px;margin-bottom:8px;background:var(--s1)}
.tbl .r.act{border-color:var(--acc)}
.tbl .nm{font:600 17px var(--sans)}
.tbl .num{font:500 13px var(--mono);color:var(--fg2);text-align:right}
.tbl .meta{grid-column:1/-1;font:400 12px var(--mono);color:var(--fg2);display:flex;gap:14px}
.tbl .meta b{color:var(--fg);font-weight:500}
.tbl .pb{grid-column:1/-1;height:2px;background:var(--s2);margin-top:6px}
.tbl .pb i{display:block;height:100%;background:var(--acc)}
.tag{font:500 10px var(--mono);color:var(--bg);background:var(--acc);padding:2px 5px;border-radius:3px;margin-left:8px;vertical-align:3px}
/* me */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;overflow:auto}
.cell{background:var(--s1);border:1px solid var(--s2);border-radius:12px;padding:14px}
.cell .big{font:600 44px/1.1 var(--mono);letter-spacing:-1px;margin-top:8px;font-variant-numeric:tabular-nums}
.cell .big small{font-size:14px;color:var(--fg2);margin-left:4px;letter-spacing:0}
.cell.w2{grid-column:1/-1}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--s2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:12px}
.bars div{flex:1;background:var(--edge);border-radius:2px;transform-origin:bottom}
.bars div:last-child{background:var(--acc)}
.dl{display:flex;gap:6px;margin-top:6px}.dl b{flex:1;text-align:center;font:400 10px var(--mono);color:var(--fg2)}
/* nav */
nav{height:72px;flex:none;display:flex;border-top:1px solid var(--s2);position:relative;padding-bottom:14px}
nav button{flex:1;background:none;border:0;color:var(--fg2);font:600 13px var(--sans);cursor:pointer;transition:color .15s var(--em);display:flex;align-items:center;justify-content:center;gap:6px}
nav button .n{font:500 10px var(--mono);border:1px solid var(--edge);border-radius:4px;padding:1px 4px}
nav button.on{color:var(--fg)}
nav button.on .n{border-color:var(--acc);color:var(--acc)}
.ind{position:absolute;top:-1px;height:2px;background:var(--acc);width:40px;transition:transform .22s var(--em)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>
  <div class="badge">C · 夜读</div>
  <main>
    <section class="page on" id="p-learn">
      <div class="top"><div class="row"><span class="lbl">CET-6 · test20 · recognize</span><span class="ctr"><span class="roll" id="ctr">00</span>/20</span></div><div class="segs" id="segs"></div></div>
      <div class="deck"><div class="card" id="card"></div></div>
      <div class="keys" id="keys" data-mode="front">
        <button class="flipk" data-r="flip">显示释义 <span class="k">SPACE</span></button>
        <button class="r3 again" data-r="again"><span class="fill"></span><span class="n">1</span>不认识</button>
        <button class="r3 hard" data-r="hard"><span class="fill"></span><span class="n">2</span>模糊</button>
        <button class="r3 good" data-r="good"><span class="fill"></span><span class="n">3</span>认识</button>
      </div>
    </section>
    <section class="page" id="p-books">
      <div class="ph"><h1>词库</h1><span class="lbl">2 books · 5248 entries</span></div>
      <div class="tbl" id="tbl"></div>
    </section>
    <section class="page" id="p-me">
      <div class="ph"><h1>统计</h1><span class="lbl">2026-11-12 · thu</span></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
  <nav id="nav"><span class="ind" id="ind"></span>
    <button class="on" data-p="learn"><span class="n">L</span>学习</button>
    <button data-p="books"><span class="n">B</span>词库</button>
    <button data-p="me"><span class="n">M</span>我的</button></nav>
</div>
<script>
const WORDS = [{"word":"pesticide","phonetic":"/ˈpestɪsaɪd/","meaning":"n. 农药；杀虫剂","example":"Farmers are encouraged to use less pesticide to protect the soil and water.\n农民们少用点农药吧，土壤和水源都护着。","approach":["① 先看词头 pest：它是考纲内的老面孔，本义就是「害虫、瘟疫」，一读到它脑子里立刻浮出庄稼叶子上密密麻麻啃食的虫子，这就是这个词要对付的对象。","② 再看词尾 -cide：这是一个真实且高频的后缀，来自拉丁语「切、杀」。已经背过的 suicide＝sui(自己)+cide＝自杀，homicide＝homi(人)+cide＝杀人，所以只要看到 -cide 就锁定「杀」这个动作。","③ 中间那根细小的 i 只是把两头焊起来的拼写接缝，不用赋予额外含义。把两截合起来：杀 pests 的东西，也就是用来杀死害虫的药剂 ——> pesticide 农药、杀虫剂。","④ 顺带记一条同根家族链：pest(害虫) + cide(杀) 是「杀虫子」，那么 herbi(草)+cide 就是除草剂，insecti(昆虫)+cide 就是杀虫剂，一串词一起拿下。"],"collocations":["spray pesticide —— 喷药，往叶背洒","pesticide residue —— 农药残留，果子上的","a chemical pesticide —— 化学合成的那种药"]},{"word":"evaporate","phonetic":"/ɪˈvæpəreɪt/","meaning":"v. 蒸发；使蒸发；消失","example":"The puddle on the road evaporated quickly under the hot sun.\n路上的水洼，烈日一晒就蒸发了。","approach":["① 先看词头 e-，它是 ex- 的变形，含义是「往外、离开原处」，水离开水面就是往天上跑。","② 再看中间 vapor，它就是「蒸汽」本身，和名词 vapour 一模一样，正是水变成的那团白气。","③ 最后 -ate 是动词后缀，表示「使成为某种状态」，合起来就是「使变成蒸汽往外走」——> 蒸发。"],"collocations":["evaporate into —— 蒸发成…","water evaporates —— 水分蒸发","evaporate from —— 从…中蒸发"]},{"word":"equate","phonetic":"/ɪˈkweɪt/","meaning":"v. 等同；把…等同于","example":"Many people equate happiness with wealth, but the two are not the same.\n很多人把幸福和财富划上等号，可这两样东西真不是一回事。","approach":["① 先看词根 equ-：equal、equality、equivalent 里都藏着它，意思是「相等、一样」，这是你已经背过的老朋友。","② 再看后缀 -ate：它把形容词性的「相等」变成一个动作，表示「使…」，于是整词就是「使两样东西相等」。","③ 合起来：使 A 和 B 相等，就是在心里把二者画上等号、当成同一回事 ——> equate 等同；把…等同于。"],"collocations":["equate A with B —— 把 A 和 B 划等号","be equated to —— 被人拿来跟…划等号","equate success with money —— 拿钱当成功的尺子"]},{"word":"marble","phonetic":"/ˈmɑːrbl/","meaning":"n. 大理石","example":"The palace floor was laid with polished white marble.\n宫殿的地面，铺的就是打磨过的白色大理石。","approach":["① 先看读音：marble 读 /ˈmɑːrbl/，第一个音节 /mɑːr/ 与中文「妈」的声母韵母都接近，可以借「妈」来记。","② 再看第二个音节 /bl/，爆破音 /b/ 加上轻化的 /l/，听起来像「不了」，于是整个词在耳朵里变成「妈不了」——妈妈搬不动的那块东西。","③ 把声音和意思接上：妈妈使尽力气也「搬不了」的那块石头，一定又硬又白又沉，正是宫殿地面和雕塑用的那种石头 ——> 大理石。"],"collocations":["a marble floor —— 大理石地面，踩着都显贵","a marble statue —— 大理石雕像，站着不动也体面","carved from marble —— 从大理石里雕出来的，料子比手艺还硬"]},{"word":"squad","phonetic":"/skwɒd/","meaning":"n. 班，小组；（军队的）班","example":"A squad of soldiers marched across the yard in step.\n一队士兵踏着整齐的步子穿过院子。","approach":["① 先看读音：squad /skwɒd/，四个音一口气压成一个短促的方块音，重音落在后面，听着像一群人同时落脚的一声「跨·蹬」。","② 再看画面：一队士兵排成一块方阵，同一秒抬腿、同一秒踩下，鞋底同时砸地，扬起一团灰，旁边的人被震得缩脖子。","③ 合起来：一个人迈步是散的，一群人同时落脚才砸出这一声「跨·蹬」——> squad 就是被编在一起、步调统一的那一小队人，班、小组。"],"collocations":["a squad of soldiers —— 一个班的大兵，齐齐整整","rescue squad —— 救援小组，出事就往里冲的那种","squad leader —— 班长，管这伙人的头"]}];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const EM='cubic-bezier(.2,0,0,1)', OUT='cubic-bezier(.3,0,.8,.15)';
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
function A(el,kf,o){ if(RM){kf=[{opacity:kf[0].opacity??1},{opacity:kf[kf.length-1].opacity??1}];o={...o,duration:80,delay:0}} return el.animate(kf,{fill:'both',...o}).finished }
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
$('#segs').innerHTML='<i></i>'.repeat(20);
let idx=0,done=0,flipped=false,busy=false;
const card=$('#card'),keys=$('#keys');
function render(){
  card.getAnimations({subtree:true}).forEach(a=>a.cancel());
  keys.querySelectorAll('.fill').forEach(f=>f.getAnimations().forEach(a=>a.cancel()));
  const w=WORDS[idx%WORDS.length]; flipped=false; card.className='card'; keys.dataset.mode='front';
  const [en,zh]=w.example.split('\n');
  card.innerHTML=`<span class="stripe"></span><div class="head"><div class="lbl">${String(idx%20+1).padStart(2,'0')} / new</div><div class="w" style="margin-top:10px">${esc(w.word)}</div><div class="pho">${esc(w.phonetic)}</div></div>
   <div class="scan"></div>
   <div class="back"><div class="mean">${esc(w.meaning)}</div>
   <div class="blk"><div class="lbl">approach</div>${w.approach.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
   <div class="blk"><div class="lbl">collocations</div>${w.collocations.map(p=>{const [a,...b]=p.split('——');return `<div class="kv"><code>${esc(a.trim())}</code><span>${esc(b.join('——').trim())}</span></div>`}).join('')}</div>
   <div class="blk"><div class="lbl">example</div><p style="color:var(--fg)">${esc(en)}</p><p>${esc(zh||'')}</p></div></div>
   <div class="hintc"><span class="k">TAP</span><span class="k">SPACE</span><span class="lbl">reveal</span></div>`;
}
async function flip(){
  if(flipped||busy) return; busy=true; flipped=true; card.classList.add('flipped'); keys.dataset.mode='back';
  A(card.querySelector('.scan'),[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:180,easing:EM});
  A(card.querySelector('.back'),[{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0% 0)'}],{duration:180,easing:EM});
  keys.querySelectorAll('.r3').forEach(b=>A(b,[{opacity:0},{opacity:1}],{duration:120,easing:EM}));
  await wait(180); busy=false;
}
async function rate(r){
  if(!flipped||busy) return; busy=true;
  const fill=keys.querySelector('.'+r+' .fill');
  if(r==='good'){
    await A(fill,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:120,easing:EM});
    await A(card,[{transform:'none',opacity:1},{transform:'translateY(-12px)',opacity:0}],{duration:160,easing:OUT});
  }else{
    const col=r==='again'?'var(--bad)':'var(--warn)';
    A(fill,[{transform:'scaleX(0)',opacity:.35},{transform:'scaleX(1)',opacity:.35}],{duration:120,easing:EM});
    const st=card.querySelector('.stripe'),w=card.querySelector('.w'); st.style.background=col;
    A(st,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:140,easing:EM});
    A(w,[{color:'#F5F5F7'},{color:col,offset:.15},{color:col,offset:.8},{color:'#F5F5F7'}],{duration:940,easing:'linear'});
    await wait(740);
    await A(card,[{transform:'none',opacity:1},{transform:'translateY(-12px)',opacity:0}],{duration:160,easing:OUT});
  }
  const prev=done; done=Math.min(20,done+1); idx++; render(); segs(prev);
  await A(card,[{transform:'translateY(12px)',opacity:0},{transform:'none',opacity:1}],{duration:200,easing:EM});
  busy=false;
}
function segs(prev){
  const s=$('#segs').children; for(let i=prev;i<done;i++) setTimeout(()=>s[i].classList.add('on'),RM?0:(i-prev)*80);
  const c=$('#ctr'); A(c,[{transform:'none'},{transform:'translateY(-100%)'}],{duration:90,easing:OUT}).then(()=>{c.textContent=String(done).padStart(2,'0');A(c,[{transform:'translateY(100%)'},{transform:'none'}],{duration:140,easing:EM})});
}
card.addEventListener('click',flip);
keys.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.dataset.r==='flip'?flip():rate(b.dataset.r)});
/* books / me */
$('#tbl').innerHTML=[['六级记忆卡',5228,2,0,0,262,1],['测试·20词',20,0,0,0,1,0],['生词本',7,7,43,3,2,0]].map(([n,t,l,m,d,e,a])=>
 `<div class="r ${a?'act':''}"><div class="nm">${n}${a?'<span class="tag">ACTIVE</span>':''}</div><div class="num">${l}/${t}</div>
  <div class="meta"><span>mastery <b>${m}%</b></span><span>due <b>${d}</b></span><span>eta <b>${e}d</b></span></div><div class="pb"><i style="width:${Math.max(.5,l/t*100)}%"></i></div></div>`).join('');
const HEAT=Array.from({length:42},(_,i)=>[0,0,1,2,1,3,2,0,1,2,3,3,1,2][i%14]*(i>27?1:(i%3?1:0)));
$('#grid').innerHTML=`<div class="cell"><div class="lbl">today</div><div class="big" data-n="12">0<small>words</small></div></div>
 <div class="cell"><div class="lbl">streak</div><div class="big" data-n="7">0<small>days</small></div></div>
 <div class="cell"><div class="lbl">mastery</div><div class="big" data-n="38">0<small>%</small></div></div>
 <div class="cell"><div class="lbl">due</div><div class="big" data-n="31">0<small>cards</small></div></div>
 <div class="cell w2"><div class="lbl">last 7 days · new</div><div class="bars">${[14,22,9,30,18,26,12].map(v=>`<div style="height:${v/30*100}%"></div>`).join('')}</div><div class="dl">${['FRI','SAT','SUN','MON','TUE','WED','THU'].map(d=>`<b>${d}</b>`).join('')}</div></div>
 <div class="cell w2"><div class="lbl">activity · 6 weeks</div><div class="heat">${HEAT.map(v=>`<i style="background:${['#1F1F23','#3a4a14','#7aa21f','#C6FF3D'][v]}"></i>`).join('')}</div></div>`;
function count(el){const n=+el.dataset.n,sm=el.querySelector('small').outerHTML,t0=performance.now(),D=RM?1:420;
  (function f(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.innerHTML=Math.round(n*e)+sm;if(p<1)requestAnimationFrame(f)})(t0)}
function enter(p){
  const els=p==='books'?document.querySelectorAll('.tbl .r'):document.querySelectorAll('.cell');
  els.forEach((el,i)=>A(el,[{opacity:0},{opacity:1}],{duration:160,delay:i*20,easing:'ease-out'}));
  if(p==='me'){document.querySelectorAll('.big').forEach(count);document.querySelectorAll('.bars div').forEach((el,i)=>A(el,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:220,delay:i*20,easing:EM}))}
}
let cur='learn';
function ind(){const b=$('#nav button.on'),k=$('#phone').getBoundingClientRect().width/390,n=$('#nav').getBoundingClientRect(),r=b.getBoundingClientRect();
  $('#ind').style.transform=`translateX(${(r.left-n.left)/k+(r.width/k-40)/2}px)`}
async function go(p){
  if(p===cur) return; const from=$('#p-'+cur),to=$('#p-'+p); cur=p;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); ind();
  A(from,[{opacity:1},{opacity:0}],{duration:150,easing:EM}).then(()=>{if(cur!==from.id.slice(2))from.classList.remove('on')});
  to.classList.add('on'); enter(p);
  await A(to,[{opacity:0},{opacity:1}],{duration:150,easing:EM});
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');b&&go(b.dataset.p)});
addEventListener('keydown',e=>{const m={l:'learn',b:'books',m:'me'}[e.key.toLowerCase()];if(m&&!e.ctrlKey){go(m);return}
  if(cur!=='learn')return;if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='1')rate('again');if(e.key==='2')rate('hard');if(e.key==='3')rate('good')});
function fit(){const ph=$('#phone');const bare=innerWidth<=400;document.body.classList.toggle('bare',bare);const pad=bare?0:60;const s=Math.min(1,(innerWidth-pad)/390,(innerHeight-pad)/844);ph.style.transform=`scale(${s})`;ind()}
addEventListener('resize',fit);render();fit();
</script>
</body>
