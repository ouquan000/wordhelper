<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · 纸页 Quiet Paper — 不爱背单词原型</title>
<style>
:root{
  --paper:#F4EFE6; --card:#FBF8F2; --ink:#1F1B16; --ink2:#6B6257; --line:#E2D9CB;
  --zhu:#B4432B; --dai:#4A6B7A; --zhe:#8C5A2B;
  --ease:cubic-bezier(.22,.61,.36,1);
  --serif:"Source Serif 4","Source Serif Pro",Georgia,"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --cn:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#d9d2c5;display:grid;place-items:center;overflow:hidden;font-family:var(--cn);color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{width:390px;height:844px;background:var(--paper);position:relative;overflow:hidden;border-radius:44px;
  box-shadow:0 30px 80px -30px rgba(60,40,20,.45),0 0 0 10px #1c1a17;transform-origin:center;display:flex;flex-direction:column;
  background-image:radial-gradient(rgba(120,90,50,.035) 1px,transparent 1px);background-size:3px 3px}
body.bare .phone{border-radius:0;box-shadow:none}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 14px/1 var(--serif);color:var(--ink)}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:9;font:11px/1 var(--serif);letter-spacing:.12em;color:var(--ink2);border:1px solid var(--line);padding:5px 8px;border-radius:2px;background:var(--card)}
main{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden}
.page.on{visibility:visible}
/* ---------- 学习 ---------- */
.top{padding:18px 26px 0}
.top .row{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font:12px/1 var(--serif);letter-spacing:.14em;color:var(--ink2)}
.count{font:500 20px/1 var(--serif);font-variant-numeric:tabular-nums oldstyle-nums}
.count small{color:var(--ink2);font-size:14px}
.rail{margin-top:12px;height:2px;background:var(--line);position:relative}
.rail i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0;transition:width .5s var(--ease)}
.deck{flex:1;min-height:0;padding:18px 20px 8px;perspective:1400px;display:flex}
.card{flex:1;background:var(--card);border-radius:6px;position:relative;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 1px 0 var(--line),0 12px 24px -16px rgba(60,40,20,.25);border:1px solid var(--line);cursor:pointer;transform-origin:left center;overflow:hidden;min-height:0}
.card::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:1px;background:rgba(180,67,43,.18)}
.head{text-align:center;padding:0 24px;transform-origin:center center}
.word{display:inline-block;position:relative;font:500 56px/1.05 var(--serif);letter-spacing:-.5px;transition:color .3s}
.word svg{position:absolute;left:-4%;width:108%;height:14px;bottom:-12px;overflow:visible}
.word path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.pho{font:italic 18px/1.4 var(--serif);color:var(--ink2);margin-top:14px}
.hint{margin-top:44px;font-size:13px;color:var(--ink2);letter-spacing:.1em}
.hint b{font-weight:400;border-bottom:1px solid var(--line)}
.back{display:none;padding:6px 28px 24px 44px;overflow:auto;flex:1}
.card.flipped{justify-content:flex-start;cursor:default}
.card.flipped .head{padding-top:26px;text-align:left;padding-left:44px}
.card.flipped .word{font-size:36px}
.card.flipped .pho{margin-top:6px;font-size:15px}
.card.flipped .hint{display:none}
.card.flipped .back{display:block}
.mean{font:500 20px/1.5 var(--cn);margin:14px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sec{margin-top:16px}
.sec h4{font:12px/1 var(--serif);letter-spacing:.14em;color:var(--zhu);font-weight:400;margin-bottom:8px}
.sec p{font-size:14.5px;line-height:1.8;color:#3a332b;margin-bottom:6px}
.sec .en{font-family:var(--serif);font-style:italic;color:var(--ink)}
.note{position:absolute;left:44px;right:24px;bottom:18px;font:italic 15px/1.4 var(--serif);color:var(--zhe);opacity:0;pointer-events:none}
.note::before{content:"— "}
.rates{height:76px;flex:none;display:flex;align-items:center;justify-content:space-around;padding:0 18px 4px}
.rates button{background:none;border:0;font:500 17px/1 var(--cn);color:var(--ink);padding:12px 10px;position:relative;cursor:pointer;transition:color .12s linear}
.rates button::after{content:"";position:absolute;left:10px;right:10px;bottom:6px;height:1px;background:currentColor;opacity:.35;transition:height .12s linear,opacity .12s linear}
.rates button:active::after,.rates button:hover::after{height:2px;opacity:1}
.rates button kbd{font:11px var(--serif);color:var(--ink2);margin-left:6px}
.rates .again{color:var(--zhe)}.rates .hard{color:var(--dai)}.rates .good{color:var(--zhu)}
.rates .reveal{color:var(--ink2);letter-spacing:.12em}
.rates[data-mode="front"] .r3,.rates[data-mode="back"] .reveal{display:none}
/* ---------- 词库 ---------- */
.ptitle{padding:26px 26px 6px;font:500 30px/1.2 var(--serif)}
.psub{padding:0 26px 18px;color:var(--ink2);font-size:13px;letter-spacing:.06em;border-bottom:1px solid var(--line);margin:0 0 0}
.toc{padding:6px 26px;overflow:auto}
.toc li{list-style:none;padding:18px 0;border-bottom:1px solid var(--line)}
.toc .l1{display:flex;align-items:baseline;gap:8px;font:500 19px/1.3 var(--cn)}
.toc .dots{flex:1;border-bottom:1px dotted #b9ad99;transform:translateY(-4px)}
.toc .num{font:18px var(--serif);font-variant-numeric:oldstyle-nums}
.toc .l2{font-size:13px;color:var(--ink2);margin-top:6px;display:flex;justify-content:space-between}
.toc .bar{height:1px;background:var(--line);margin-top:10px;position:relative}
.toc .bar i{position:absolute;left:0;top:-.5px;height:2px;background:var(--ink)}
.seal{display:inline-block;font-size:11px;color:var(--zhu);border:1px solid var(--zhu);padding:2px 5px;border-radius:2px;transform:rotate(-4deg);letter-spacing:.1em}
.toc .act{color:var(--ink2);font-size:13px;border-bottom:1px solid var(--line)}
/* ---------- 我的 ---------- */
.stats{padding:6px 26px;overflow:auto}
.big{display:flex;align-items:flex-end;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.big .n{font:500 72px/0.9 var(--serif);font-variant-numeric:oldstyle-nums}
.big .u{color:var(--ink2);font-size:14px;line-height:1.6}
.pair{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.pair>div{padding:18px 0}
.pair>div+div{border-left:1px solid var(--line);padding-left:18px}
.pair .k{font:12px var(--serif);letter-spacing:.14em;color:var(--ink2)}
.pair .v{font:500 30px/1.3 var(--serif);margin-top:6px}
.ring{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.week{padding:20px 0}
.week .k{font:12px var(--serif);letter-spacing:.14em;color:var(--ink2);margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:14px;height:120px;border-bottom:1px solid var(--ink)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars span{width:2px;background:var(--ink);transform-origin:bottom}
.bars div:last-child span{background:var(--zhu);width:3px}
.days{display:flex;gap:14px;margin-top:6px}.days b{flex:1;text-align:center;font:400 11px var(--serif);color:var(--ink2)}
/* ---------- tabs ---------- */
nav{height:70px;flex:none;display:flex;border-top:1px solid var(--line);padding-bottom:12px;background:var(--paper)}
nav button{flex:1;background:none;border:0;font:500 15px/1 var(--cn);color:var(--ink2);cursor:pointer;position:relative;letter-spacing:.2em;transition:color .24s ease-out}
nav button.on{color:var(--ink)}
nav button::before{content:"";position:absolute;top:-1px;left:50%;width:28px;margin-left:-14px;height:2px;background:var(--zhu);transform:scaleX(0);transition:transform .3s var(--ease)}
nav button.on::before{transform:scaleX(1)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span>9:41</span><span style="font-weight:400;letter-spacing:2px">▮▮▮ ◔</span></div>
  <div class="badge">A · 纸页</div>
  <main>
    <section class="page on" id="p-learn">
      <div class="top">
        <div class="row"><span class="eyebrow">测试 · 20 词　·　认词</span><span class="count"><span id="cnt">0</span> <small>/ 20</small></span></div>
        <div class="rail"><i id="rail"></i></div>
      </div>
      <div class="deck"><div class="card" id="card"></div></div>
      <div class="rates" id="rates" data-mode="front">
        <button class="reveal" data-r="flip">轻触纸面，翻开释义<kbd>空格</kbd></button>
        <button class="r3 again" data-r="again">不认识<kbd>1</kbd></button>
        <button class="r3 hard" data-r="hard">模糊<kbd>2</kbd></button>
        <button class="r3 good" data-r="good">认识<kbd>3</kbd></button>
      </div>
    </section>
    <section class="page" id="p-books">
      <h1 class="ptitle">我的词库</h1>
      <p class="psub">二本在册 · 累计词条 5248</p>
      <ul class="toc" id="toc"></ul>
    </section>
    <section class="page" id="p-me">
      <h1 class="ptitle">我的</h1>
      <p class="psub">十一月十二日 · 星期四</p>
      <div class="stats" id="stats"></div>
    </section>
  </main>
  <nav id="nav"><button class="on" data-p="learn">学习</button><button data-p="books">词库</button><button data-p="me">我的</button></nav>
</div>
<script>
const WORDS = [{"word":"pesticide","phonetic":"/ˈpestɪsaɪd/","meaning":"n. 农药；杀虫剂","example":"Farmers are encouraged to use less pesticide to protect the soil and water.\n农民们少用点农药吧，土壤和水源都护着。","approach":["① 先看词头 pest：它是考纲内的老面孔，本义就是「害虫、瘟疫」，一读到它脑子里立刻浮出庄稼叶子上密密麻麻啃食的虫子，这就是这个词要对付的对象。","② 再看词尾 -cide：这是一个真实且高频的后缀，来自拉丁语「切、杀」。已经背过的 suicide＝sui(自己)+cide＝自杀，homicide＝homi(人)+cide＝杀人，所以只要看到 -cide 就锁定「杀」这个动作。","③ 中间那根细小的 i 只是把两头焊起来的拼写接缝，不用赋予额外含义。把两截合起来：杀 pests 的东西，也就是用来杀死害虫的药剂 ——> pesticide 农药、杀虫剂。","④ 顺带记一条同根家族链：pest(害虫) + cide(杀) 是「杀虫子」，那么 herbi(草)+cide 就是除草剂，insecti(昆虫)+cide 就是杀虫剂，一串词一起拿下。"],"collocations":["spray pesticide —— 喷药，往叶背洒","pesticide residue —— 农药残留，果子上的","a chemical pesticide —— 化学合成的那种药"]},{"word":"evaporate","phonetic":"/ɪˈvæpəreɪt/","meaning":"v. 蒸发；使蒸发；消失","example":"The puddle on the road evaporated quickly under the hot sun.\n路上的水洼，烈日一晒就蒸发了。","approach":["① 先看词头 e-，它是 ex- 的变形，含义是「往外、离开原处」，水离开水面就是往天上跑。","② 再看中间 vapor，它就是「蒸汽」本身，和名词 vapour 一模一样，正是水变成的那团白气。","③ 最后 -ate 是动词后缀，表示「使成为某种状态」，合起来就是「使变成蒸汽往外走」——> 蒸发。"],"collocations":["evaporate into —— 蒸发成…","water evaporates —— 水分蒸发","evaporate from —— 从…中蒸发"]},{"word":"equate","phonetic":"/ɪˈkweɪt/","meaning":"v. 等同；把…等同于","example":"Many people equate happiness with wealth, but the two are not the same.\n很多人把幸福和财富划上等号，可这两样东西真不是一回事。","approach":["① 先看词根 equ-：equal、equality、equivalent 里都藏着它，意思是「相等、一样」，这是你已经背过的老朋友。","② 再看后缀 -ate：它把形容词性的「相等」变成一个动作，表示「使…」，于是整词就是「使两样东西相等」。","③ 合起来：使 A 和 B 相等，就是在心里把二者画上等号、当成同一回事 ——> equate 等同；把…等同于。"],"collocations":["equate A with B —— 把 A 和 B 划等号","be equated to —— 被人拿来跟…划等号","equate success with money —— 拿钱当成功的尺子"]},{"word":"marble","phonetic":"/ˈmɑːrbl/","meaning":"n. 大理石","example":"The palace floor was laid with polished white marble.\n宫殿的地面，铺的就是打磨过的白色大理石。","approach":["① 先看读音：marble 读 /ˈmɑːrbl/，第一个音节 /mɑːr/ 与中文「妈」的声母韵母都接近，可以借「妈」来记。","② 再看第二个音节 /bl/，爆破音 /b/ 加上轻化的 /l/，听起来像「不了」，于是整个词在耳朵里变成「妈不了」——妈妈搬不动的那块东西。","③ 把声音和意思接上：妈妈使尽力气也「搬不了」的那块石头，一定又硬又白又沉，正是宫殿地面和雕塑用的那种石头 ——> 大理石。"],"collocations":["a marble floor —— 大理石地面，踩着都显贵","a marble statue —— 大理石雕像，站着不动也体面","carved from marble —— 从大理石里雕出来的，料子比手艺还硬"]},{"word":"squad","phonetic":"/skwɒd/","meaning":"n. 班，小组；（军队的）班","example":"A squad of soldiers marched across the yard in step.\n一队士兵踏着整齐的步子穿过院子。","approach":["① 先看读音：squad /skwɒd/，四个音一口气压成一个短促的方块音，重音落在后面，听着像一群人同时落脚的一声「跨·蹬」。","② 再看画面：一队士兵排成一块方阵，同一秒抬腿、同一秒踩下，鞋底同时砸地，扬起一团灰，旁边的人被震得缩脖子。","③ 合起来：一个人迈步是散的，一群人同时落脚才砸出这一声「跨·蹬」——> squad 就是被编在一起、步调统一的那一小队人，班、小组。"],"collocations":["a squad of soldiers —— 一个班的大兵，齐齐整整","rescue squad —— 救援小组，出事就往里冲的那种","squad leader —— 班长，管这伙人的头"]}];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE='cubic-bezier(.22,.61,.36,1)';
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
function A(el,kf,o){ if(RM){kf=kf.map(f=>({opacity:f.opacity??1}));o={...o,duration:120,delay:0}} return el.animate(kf,{fill:'both',...o}).finished }
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
let idx=0,done=0,flipped=false,busy=false;
const card=$('#card'),rates=$('#rates');
function render(){
  card.getAnimations({subtree:true}).forEach(a=>a.cancel());
  const w=WORDS[idx%WORDS.length]; flipped=false; card.className='card'; rates.dataset.mode='front';
  const [en,zh]=w.example.split('\n');
  card.innerHTML=`<div class="head"><div class="word">${esc(w.word)}<svg viewBox="0 0 100 10" preserveAspectRatio="none"><path class="ln" pathLength="100" d="M1 5 L99 5" stroke="var(--zhu)"/><path class="wv" pathLength="100" d="M1 5 Q6 0 11 5 T21 5 T31 5 T41 5 T51 5 T61 5 T71 5 T81 5 T91 5 T99 5" stroke="var(--dai)"/></svg></div>
   <div class="pho">${esc(w.phonetic)}</div><div class="hint">轻触 · <b>看释义与记忆思路</b></div></div>
   <div class="back"><div class="mean">${esc(w.meaning)}</div>
   <div class="sec"><h4>记忆思路 · APPROACH</h4>${w.approach.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
   <div class="sec"><h4>常用搭配 · COLLOCATIONS</h4>${w.collocations.map(p=>`<p><span class="en">${esc(p.split('——')[0])}</span>——${esc(p.split('——').slice(1).join('——'))}</p>`).join('')}</div>
   <div class="sec"><h4>例句 · EXAMPLE</h4><p class="en">${esc(en)}</p><p>${esc(zh||'')}</p></div></div>
   <div class="note" id="note"></div>`;
}
async function flip(){
  if(flipped||busy) return; busy=true; flipped=true;
  const head=card.querySelector('.head'); const f=head.querySelector('.word').getBoundingClientRect();
  card.classList.add('flipped'); rates.dataset.mode='back';
  const l=head.querySelector('.word').getBoundingClientRect();
  const s=f.width/l.width, dx=f.left-l.left, dy=f.top-l.top;
  head.style.transformOrigin='left top';
  A(head,[{transform:`translate(${dx}px,${dy}px) scale(${s})`},{transform:'none'}],{duration:420,easing:EASE});
  [...card.querySelectorAll('.back>*')].forEach((el,i)=>A(el,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:420,delay:80+i*60,easing:EASE}));
  [...rates.querySelectorAll('.r3')].forEach((el,i)=>A(el,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:300,delay:120+i*50,easing:EASE}));
  await wait(420); busy=false;
}
async function rate(r){
  if(!flipped||busy) return; busy=true;
  const word=card.querySelector('.word'), note=card.querySelector('#note');
  if(r==='good'){
    await A(card.querySelector('.ln'),[{strokeDashoffset:100,opacity:1},{strokeDashoffset:0,opacity:1}],{duration:280,easing:'ease-out'});
    await wait(120);
    await A(card,[{transform:'none',opacity:1},{transform:'translateX(-70px) rotateY(-8deg)',opacity:0}],{duration:380,easing:'cubic-bezier(.4,0,.2,1)'});
  }else if(r==='hard'){
    await A(card.querySelector('.wv'),[{strokeDashoffset:100,opacity:1},{strokeDashoffset:0,opacity:1}],{duration:260,easing:'ease-out'});
    note.style.color='var(--dai)'; note.textContent='还差一点，过几天再见';
    await A(note,[{opacity:0},{opacity:1}],{duration:260,easing:'ease-out'});
    await wait(420);
    await A(card,[{opacity:1},{opacity:0,transform:'translateX(-30px)'}],{duration:320,easing:'cubic-bezier(.4,0,.2,1)'});
  }else{
    A(word,[{opacity:1},{opacity:.4}],{duration:320,easing:'ease-in-out'});
    note.textContent='下次早点见';
    await A(note,[{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:320,easing:'ease-in-out'});
    await wait(520);
    await A(card,[{opacity:1},{opacity:0,transform:'translateY(10px)'}],{duration:300,easing:'ease-in-out'});
  }
  done=Math.min(20,done+1); idx++; progress(); render();
  await A(card,[{transform:'translateX(24px)',opacity:0},{transform:'none',opacity:1}],{duration:360,easing:EASE});
  busy=false;
}
function progress(){
  $('#rail').style.width=(done/20*100)+'%';
  const c=$('#cnt'); A(c,[{opacity:1},{opacity:0,transform:'translateY(-6px)'}],{duration:180,easing:'ease-in'}).then(()=>{c.textContent=done;A(c,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:320,easing:EASE})});
}
card.addEventListener('click',flip);
rates.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return; b.dataset.r==='flip'?flip():rate(b.dataset.r)});
/* ---------- 词库 / 我的 ---------- */
const BOOKS=[{n:'六级记忆卡',t:5228,l:2,m:0,d:'待复习 0 · 预计学完 262 天',on:true},{n:'测试 · 20 词',t:20,l:0,m:0,d:'待复习 0 · 预计学完 1 天'},{n:'生词本',t:7,l:7,m:43,d:'星标收藏的词'}];
$('#toc').innerHTML=BOOKS.map(b=>`<li><div class="l1"><span>${b.n}</span>${b.on?'<span class="seal">使用中</span>':''}<span class="dots"></span><span class="num">${b.t}</span></div>
 <div class="l2"><span>已学 ${b.l} · 掌握 ${b.m}% · ${b.d}</span><span class="act">${b.on?'提前复习':'切换'}</span></div><div class="bar"><i style="width:${Math.max(1,b.l/b.t*100)}%"></i></div></li>`).join('');
const WEEK=[14,22,9,30,18,26,12];
$('#stats').innerHTML=`<div class="big"><span class="n" id="today">12</span><span class="u">今日已学（词）<br>复习 31 · 用时 18 分</span></div>
 <div class="pair"><div><div class="k">连续打卡</div><div class="v">7 天</div></div>
 <div style="display:flex;gap:14px;align-items:center"><svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" stroke="var(--line)"/><circle id="arc" cx="32" cy="32" r="28" stroke="var(--zhu)" stroke-dasharray="175.9" stroke-dashoffset="175.9" stroke-linecap="round"/></svg><div><div class="k">掌握率</div><div class="v">38%</div></div></div></div>
 <div class="week"><div class="k">近七日 · 新学</div><div class="bars">${WEEK.map(v=>`<div><span style="height:${v/30*100}%"></span></div>`).join('')}</div><div class="days">${'五六日一二三四'.split('').map(d=>`<b>${d}</b>`).join('')}</div></div>`;
function enter(p){
  if(p==='books') [...document.querySelectorAll('#toc li')].slice(0,6).forEach((el,i)=>A(el,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300,delay:i*40,easing:'ease-out'}));
  if(p==='me'){
    [...document.querySelectorAll('#stats>div')].forEach((el,i)=>A(el,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300,delay:i*40,easing:'ease-out'}));
    A($('#arc'),[{strokeDashoffset:175.9},{strokeDashoffset:175.9*(1-.38)}],{duration:500,delay:120,easing:EASE});
    document.querySelectorAll('.bars span').forEach((el,i)=>A(el,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:500,delay:160+i*40,easing:EASE}));
  }
}
let cur='learn';
async function go(p){
  if(p===cur) return; const from=$('#p-'+cur), to=$('#p-'+p); cur=p;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  A(from,[{opacity:1},{opacity:0,transform:'translateY(4px)'}],{duration:240,easing:'ease-out'}).then(()=>{if(cur!==from.id.slice(2))from.classList.remove('on')});
  to.classList.add('on'); enter(p);
  await A(to,[{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:240,easing:'ease-out'});
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');b&&go(b.dataset.p)});
addEventListener('keydown',e=>{ if(cur!=='learn')return; if(e.code==='Space'){e.preventDefault();flip()} if(e.key==='1')rate('again'); if(e.key==='2')rate('hard'); if(e.key==='3')rate('good') });
function fit(){const ph=$('#phone');const bare=innerWidth<=400;document.body.classList.toggle('bare',bare);const pad=bare?0:60;const s=Math.min(1,(innerWidth-pad)/390,(innerHeight-pad)/844);ph.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
</script>
</body>
